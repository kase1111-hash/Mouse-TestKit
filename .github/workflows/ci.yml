name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Code quality checks (run once on Linux)
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev libwayland-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Run tests (Linux only since CLI requires evdev)
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev libwayland-dev

      - name: Run tests
        run: cargo test --verbose

  # Build for all platforms
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: mouse-testkit-gui
            asset_name: mouse-testkit-gui-linux-x64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: mouse-testkit-gui.exe
            asset_name: mouse-testkit-gui-windows-x64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: mouse-testkit-gui
            asset_name: mouse-testkit-gui-macos-arm64

          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: mouse-testkit-gui
            asset_name: mouse-testkit-gui-macos-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev libwayland-dev

      - name: Build GUI (Release)
        run: cargo build --release --bin mouse-testkit-gui --target ${{ matrix.target }}

      - name: Build CLI (Linux only)
        if: runner.os == 'Linux'
        run: cargo build --release --bin mouse-testkit --target ${{ matrix.target }}

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Upload CLI artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: mouse-testkit-cli-linux-x64
          path: target/${{ matrix.target }}/release/mouse-testkit

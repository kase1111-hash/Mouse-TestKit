[package]
name = "mouse-testkit"
version = "0.1.0"
edition = "2021"
description = "Mouse TRAP - Test Response And Positioning"
authors = ["Mouse TRAP Contributors"]
license = "MIT"
readme = "readme.md"

[dependencies]
crossterm = "0.29"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_plot = "0.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "errhandlingapi", "libloaderapi", "hidusage"] }
raw-window-handle = "0.6"

[[bin]]
name = "mouse-testkit"
path = "src/main.rs"

[[bin]]
name = "mouse-testkit-gui"
path = "src/gui/main.rs"

# Standard release profile
[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

# Ultra-compact keychain build
[profile.keychain]
inherits = "release"
opt-level = "z"
lto = "fat"
strip = "symbols"
codegen-units = 1
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

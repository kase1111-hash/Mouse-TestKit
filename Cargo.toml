[package]
name = "mouse-testkit"
version = "0.1.0"
edition = "2021"
description = "A standalone mouse testing utility"
authors = ["Mouse-TestKit Contributors"]

[dependencies]
crossterm = "0.27"
evdev = "0.12"
eframe = "0.29"
egui_plot = "0.29"

[[bin]]
name = "mouse-testkit"
path = "src/main.rs"

[[bin]]
name = "mouse-testkit-gui"
path = "src/gui/main.rs"

[profile.release]
opt-level = "s"
lto = true
strip = true
